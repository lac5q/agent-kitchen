type Query {
  # Organization
  organization(id: String!): Organization
  organizations(first: Int, after: String): OrganizationConnection!

  # Viewer
  viewer: User!

  # Teams
  team(id: String!): Team

  # Issues
  issue(id: String!): Issue
  issues(
    first: Int, after: String,
    filter: IssueFilter,
    includeArchived: Boolean
  ): IssueConnection!

  # Comments
  issueComments(
    issueId: String!,
    first: Int, after: String
  ): CommentConnection!

  # Projects
  project(id: String!): Project
  projects(
    first: Int, after: String,
    filter: ProjectFilter,
    includeArchived: Boolean
  ): ProjectConnection!

  # Initiatives (capability-gated)
  initiatives(
    first: Int, after: String,
    includeArchived: Boolean
  ): InitiativeConnection!

  # Documents
  document(id: String!): Document
  documents(
    first: Int, after: String,
    filter: DocumentFilter
  ): DocumentConnection!

  # Cycles
  cycles(
    first: Int, after: String,
    filter: CycleFilter,
    includeArchived: Boolean
  ): CycleConnection!

  # Users (assignees/creators)
  users(first: Int, after: String, filter: UserFilter): UserConnection!

  # Customers (feature-gated)
  customers(first: Int, after: String, filter: CustomerFilter): CustomerConnection!
}

scalar DateTime
scalar JSON

interface Node {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
