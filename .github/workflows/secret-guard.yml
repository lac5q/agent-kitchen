name: Secret Guard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  scan-secrets:
    name: Scan for leaked secrets & PII
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  scan-custom-patterns:
    name: Scan for internal infrastructure leaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for Tailscale / internal IPs
        run: |
          set -e
          PATTERNS='100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}'
          # Mirror the carve-outs the username/internal-domain checks already use for
          # `.planning/` and `content/research/`; also exclude `content/sandbox/` which
          # holds internal fleet-plan documents with real infra IPs by design.
          MATCHES=$(git grep -nE "$PATTERNS" -- '*.md' '*.ts' '*.tsx' '*.js' '*.json' '*.yaml' '*.yml' '*.sh' '*.py' \
            | grep -v '^.github/workflows/secret-guard.yml:' \
            | grep -v '^\.planning/' \
            | grep -v '^content/research/' \
            | grep -v '^content/sandbox/' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ INTERNAL IP ADDRESSES DETECTED:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No internal IPs found"

      - name: Check for real usernames in paths
        run: |
          set -e
          # Block real home directories while allowing documented placeholders.
          #
          # Two classes are deliberately NOT leaks and were previously flagged:
          #   1. Placeholder tokens the docs already use (`<you>`, `<user>`) —
          #      `[^/]+` matches them just as happily as a real login.
          #   2. Service/container accounts (opc on oracle-1, ubuntu, agent,
          #      runner, node). These name a role, not a person, and appear in
          #      systemd units and container paths that have to stay accurate.
          # Personal logins are still blocked; normalise them to <you>/<user>.
          # The username segment is restricted to characters a real login can
          # contain. The previous `[^/]+` matched across spaces, backticks and
          # quotes, so prose like "Disk-prune on `/home/opc`: cleared `/tmp/…`"
          # and a docker `--tmpfs /home/agent:rw,… arm64v8/alpine` flag both
          # registered as leaked home directories. Placeholders written as
          # `<you>`/`<user>` now fall outside the pattern entirely.
          MAC_HOME='/Users/'
          LINUX_HOME='/home/'
          USER_SEGMENT='[A-Za-z0-9._-]+'
          PATTERNS="${MAC_HOME}${USER_SEGMENT}/|${LINUX_HOME}${USER_SEGMENT}/"
          PLACEHOLDER='yourname|USERNAME|\$USER|\$\{USER\}'
          SERVICE_ACCOUNT='opc|ubuntu|agent|runner|node'
          ALLOWED="/Users/($PLACEHOLDER)/|/home/($PLACEHOLDER|$SERVICE_ACCOUNT)/"
          MATCHES=$(git grep -nE "$PATTERNS" -- '*.md' '*.ts' '*.tsx' '*.js' '*.json' '*.yaml' '*.yml' '*.sh' '*.py' \
            | grep -v '^.github/workflows/secret-guard.yml:' \
            | grep -v '^\.planning/' \
            | grep -v '^content/research/' \
            | grep -vE "$ALLOWED" \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ REAL USERNAME PATHS DETECTED:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No real username paths found"

      - name: Check for internal domains
        run: |
          set -e
          # What this protects: internal *service hostnames*, which map the
          # fleet. This repo is private and is Epilogue Capital's own product,
          # so the apex domain — and addresses at it — are public company
          # information appearing legitimately in application source, tests and
          # deploy configs, not a leak. Blocking the bare string `epiloguecapital`
          # therefore flagged the app's own code and could never pass.
          #
          # Detection is per-hostname (`git grep -o`) rather than per-line, so a
          # line mentioning both a public and an internal host still fails on
          # the internal one. `memroos` and `memroos-cordant` are the published
          # operator endpoints; every other label under the domain fails.
          ALLOWED_HOST_SUFFIX=':(memroos|memroos-cordant)\.epiloguecapital\.com$'
          MATCHES=$(git grep -nioE '[A-Za-z0-9-]+\.epiloguecapital\.com' -- '*.md' '*.ts' '*.tsx' '*.js' '*.json' '*.yaml' '*.yml' '*.sh' '*.py' \
            | grep -v '^.github/workflows/secret-guard.yml:' \
            | grep -viE "$ALLOWED_HOST_SUFFIX" \
            || true)
          # An unsubstituted template placeholder means a doc shipped half-edited.
          PLACEHOLDERS=$(git grep -n 'your-internal-domain-here' -- '*.md' '*.ts' '*.tsx' '*.js' '*.json' '*.yaml' '*.yml' '*.sh' '*.py' \
            | grep -v '^.github/workflows/secret-guard.yml:' \
            || true)
          if [ -n "$MATCHES" ] || [ -n "$PLACEHOLDERS" ]; then
            echo "❌ INTERNAL DOMAINS DETECTED:"
            # Plain `[ -n .. ] && echo` would abort under `set -e` when the
            # first list is empty, hiding the second one's findings.
            if [ -n "$MATCHES" ]; then echo "$MATCHES"; fi
            if [ -n "$PLACEHOLDERS" ]; then echo "$PLACEHOLDERS"; fi
            exit 1
          fi
          echo "✅ No internal domains found"

      - name: Check for .env.local commits
        run: |
          set -e
          if git ls-files | grep -Eq '(^|/)\.env\.local$'; then
            echo "❌ .env.local is committed anywhere in the repo — move secrets to .env.example with placeholders"
            exit 1
          fi
          echo "✅ No .env.local in git"

  scan-filenames:
    name: Scan for suspicious filenames
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for credential files
        run: |
          set -e
          SUSPICIOUS=$(git ls-files | grep -iE '\.pem$|\.key$|\.p12$|\.pfx$|id_rsa|id_ed25519|credentials\.json|service-account.*\.json' || true)
          if [ -n "$SUSPICIOUS" ]; then
            echo "❌ SUSPICIOUS FILES DETECTED:"
            echo "$SUSPICIOUS"
            exit 1
          fi
          echo "✅ No credential files in git"
