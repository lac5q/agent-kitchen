name: Deploy MemRoOS to Heroku

# Heroku is decommissioned as the operator deployment (`web=0`) — operator
# production is oracle-1 behind the `memroos-oracle` Cloudflare Tunnel, per
# docs/production-deployment.md. Leaving the `push:` trigger on meant every
# commit to main fired a deploy that could not succeed, and every failure
# mailed the repo owner. Manual-only until Heroku is either recommissioned or
# this workflow is deleted outright.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Heroku production deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          NPM_CONFIG_PRODUCTION: "false"
        run: |
          set -euo pipefail
          if [ -z "${HEROKU_API_KEY:-}" ]; then
            echo "HEROKU_API_KEY is not configured in repository secrets." >&2
            exit 1
          fi
          export HEROKU_API_KEY
          app_name="${HEROKU_APP_NAME:-}"
          if [ -z "$app_name" ]; then
            app_name="$(heroku apps --json | node -e '
              const apps = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const preferred = apps.find((app) => /memroos|epilogue/i.test(app.name));
              const chosen = preferred ?? apps[0];
              if (!chosen) {
                console.error("No Heroku apps visible for this API key.");
                process.exit(1);
              }
              process.stdout.write(chosen.name);
            ')"
          fi
          echo "Deploying to Heroku app: ${app_name}"
          git remote remove heroku 2>/dev/null || true
          git remote add heroku "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${app_name}.git"
          git push heroku HEAD:main

      - name: Verify onboarding route on production
        run: bash scripts/verify-onboarding-deploy.sh
