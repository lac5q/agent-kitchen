name: Monorepo CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

jobs:
  memroos:
    name: Memroos tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install linux native bindings
        run: npm install @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu --no-save

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check route auth boundary
        run: npm run check:route-auth-boundary

      - name: Check Next trust boundary
        run: npm run check:next-trust-boundary

      - name: Check future spikes
        run: npm run check:future-spikes

      - name: Run Memroos tests
        run: npm test -- --run

      - name: Build Memroos
        run: npm run build

      - name: Docker compose smoke
        run: ./scripts/docker-compose-smoke.sh --config-only

  services:
    name: Python service smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r services/orchestration/requirements.txt

      - name: Run Knowledge MCP tests
        env:
          PYTHONPATH: services/knowledge-mcp
        run: python -m pytest services/knowledge-mcp/tests

      - name: Run orchestration tests
        env:
          PYTHONPATH: services/orchestration
        run: python -m pytest services/orchestration/tests

      - name: Run voice server tests
        run: python -m pytest services/voice-server/tests

      - name: Compile Python service modules
        run: python -m py_compile services/memory/*.py services/knowledge-mcp/knowledge_system/*.py

      - name: Check shell scripts
        run: bash -n start.sh services/memory/*.sh

  recall-canary:
    name: Memory recall canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install linux native bindings
        run: npm install @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu --no-save

      - name: Run recall canary gate
        run: npm run check:recall-canary

  operator-load-slo:
    name: Operator load SLO gate (ENTOPS-01)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate operator load gate logic on PRs
        if: github.event_name == 'pull_request'
        run: node --test scripts/check-operator-load-slo.test.mjs

      - name: Run operator load SLO gate
        if: github.event_name != 'pull_request'
        # Reads reports/operator-load/latest.json (committed baseline by
        # default; gate treats baseline as NOT pass until a real run
        # produces a fresh status:"pass" report). Does not execute the
        # live harness — production-style runs are opt-in via env.
        run: npm run check:operator-load-slo

  promotion-eval:
    name: BELIEF-05 promotion eval canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install linux native bindings
        run: npm install @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu --no-save

      - name: Run BELIEF-05 promotion eval gate
        # Runs the committed gold promotion eval cases (evals/belief/cases.json)
        # through the real promotion pipeline against an in-memory DB. Fails on
        # any of the five BELIEF-05 invariants regressing. Sits next to the
        # recall canary; extends (does not replace) the Phase 118 recall evals.
        run: npm run check:belief-eval
