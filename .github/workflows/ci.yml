name: Monorepo CI

# No `schedule:` here, unlike the private repo.
#
# This repository is deliberately held at an earlier version than
# lac5q/memroos-product; current work ships privately. A nightly cron over
# frozen code cannot catch a regression — nothing lands here to regress — so it
# only mailed the owner a failure every morning, which is how a real signal gets
# tuned out. The daily failure was also partly by design: the Operator load SLO
# gate runs on `schedule` and intentionally fails until a live load report
# exists.
#
# Push and pull_request still run, so the gates are there if this repo is ever
# touched again. Use workflow_dispatch for an on-demand check.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  memroos:
    name: Memroos tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install linux native bindings
        run: npm install @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu --no-save

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check route auth boundary
        run: npm run check:route-auth-boundary

      - name: Check SQLite access boundary (STORE-03)
        run: npm run check:sqlite-allowlist

      - name: Check lib/ root boundary (LIBNORM-03)
        run: npm run check:lib-boundary

      - name: Health-check branch tests (CFGDUR-03)
        run: npm run check:health-check

      - name: Scheduler liveness tests (CFGDUR-05)
        run: npm run check:scheduler-liveness

      - name: Check Next trust boundary
        run: npm run check:next-trust-boundary

      - name: Check future spikes
        run: npm run check:future-spikes

      - name: Check observe maturity drift (v8.16 OBSERVE-13)
        # Keeps docs/runtime-adapter-maturity.md in lock-step with the
        # observe-sidecar catalog (OBSERVE_HARNESS_PATHS) and the installer
        # TARGETS rows. Phase 171 / Phase 169–171 introduces the check.
        run: npm run check:observe-maturity-drift

      - name: Run Memroos tests (fast suite)
        run: npm test -- --run

      - name: Run Memroos tests (slow suite)
        # Onboarding routes + bcrypt password hashing. Mirrors the local
        # `npm run test:slow -- --run` so CI preserves coverage while the
        # default milestone gate stays fast and deterministic.
        run: npm run test:slow -- --run

      - name: Build Memroos
        run: npm run build

      - name: Docker compose smoke
        run: ./scripts/docker-compose-smoke.sh --config-only

  services:
    name: Python service smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r services/orchestration/requirements.txt
          python -m pip install -r services/connmem/requirements.txt

      - name: Run Knowledge MCP tests
        env:
          PYTHONPATH: services/knowledge-mcp
        run: python -m pytest services/knowledge-mcp/tests

      - name: Run orchestration tests
        env:
          PYTHONPATH: services/orchestration
        run: python -m pytest services/orchestration/tests

      - name: Run voice server tests
        run: python -m pytest services/voice-server/tests

      - name: Run connmem tests (Phase 185 / v8.27)
        # CONNMEM-RT-02: 141/141 tests must pass on every PR. The
        # operator.py → operator_surface.py rename (Phase 185) is a
        # prerequisite — the stdlib operator shadow made these tests
        # uncollectable when services/connmem was on PYTHONPATH.
        env:
          PYTHONPATH: services/connmem
        run: python -m pytest services/connmem/tests

      - name: Compile Python service modules
        run: python -m py_compile services/memory/*.py services/knowledge-mcp/knowledge_system/*.py

      - name: Check shell scripts
        run: bash -n start.sh services/memory/*.sh

  recall-canary:
    name: Memory recall canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install linux native bindings
        run: npm install @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu --no-save

      - name: Run recall canary gate
        run: npm run check:recall-canary

  operator-load-slo:
    name: Operator load SLO gate (ENTOPS-01)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate operator load gate logic
        run: node --test scripts/check-operator-load-slo.test.mjs

      - name: Run operator load SLO gate (live report required)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # Reads reports/operator-load/latest.json (gitignored; uploaded by
        # opt-in load harness runs). Baseline is intentionally non-passing
        # so enterprise-claim vocabulary stays blocked until a real run
        # produces status:"pass". Push/PR CI validates gate logic only.
        run: npm run check:operator-load-slo

  promotion-eval:
    name: BELIEF-05 promotion eval canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install linux native bindings
        run: npm install @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu --no-save

      - name: Run BELIEF-05 promotion eval gate
        # Runs the committed gold promotion eval cases (evals/belief/cases.json)
        # through the real promotion pipeline against an in-memory DB. Fails on
        # any of the five BELIEF-05 invariants regressing. Sits next to the
        # recall canary; extends (does not replace) the Phase 118 recall evals.
        run: npm run check:belief-eval

  policy-regression:
    name: Policy regression corpus (POLGOV-05)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install linux native bindings
        run: npm install @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu --no-save

      - name: Run policy regression corpus
        run: npm run check:policy-regression
