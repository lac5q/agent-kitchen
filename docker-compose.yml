name: memroos

services:
  memroos:
    build:
      context: .
      dockerfile: docker/Dockerfile.memroos
    ports:
      - "${MEMROOS_PORT:-3000}:3000"
    environment:
      MEMROOS_A2A_PROFILE: ${MEMROOS_A2A_PROFILE:-local-dev}
      MEMROOS_PUBLIC_BASE_URL: ${MEMROOS_PUBLIC_BASE_URL:-http://localhost:3000}
      MEMROOS_A2A_ENDPOINT_BASE_URL: ${MEMROOS_A2A_ENDPOINT_BASE_URL:-http://localhost:3000}
      MEMROOS_OPERATOR_API_KEY: ${MEMROOS_OPERATOR_API_KEY:-}
      MEMROOS_JWT_SECRET: ${MEMROOS_JWT_SECRET:-local-compose-jwt-secret-change-me-32chars}
      MEM0_URL: ${MEMROOS_DOCKER_MEM0_URL:-http://mem0:3201}
      ORCHESTRATION_SERVICE_URL: ${MEMROOS_DOCKER_ORCHESTRATION_SERVICE_URL:-http://orchestration:3210}
      CONNMEM_URL: ${CONNMEM_URL:-${MEMROOS_DOCKER_CONNMEM_URL:-http://connmem:3290}}
      NEO4J_HTTP_URL: ${MEMROOS_DOCKER_NEO4J_HTTP_URL:-http://neo4j:7474}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${MEMROOS_DOCKER_NEO4J_PASSWORD:-local-neo4j-password}
      SQLITE_DB_PATH: /data/conversations.db
      CLAUDE_MEMORY_PATH: /data/claude-memory
      KNOWLEDGE_BASE_PATH: /knowledge
      MEMROOS_DATA_RESIDENCY: ${MEMROOS_DATA_RESIDENCY:-0}
      LOCAL_JUDGE_PROVIDER: ${LOCAL_JUDGE_PROVIDER:-ollama}
      LOCAL_JUDGE_ENDPOINT: ${LOCAL_JUDGE_ENDPOINT:-http://host.docker.internal:11434/v1}
      LOCAL_JUDGE_MODEL: ${LOCAL_JUDGE_MODEL:-hermes3}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    volumes:
      - memroos-data:/data
      - ${KNOWLEDGE_BASE_PATH:-./docs}:/knowledge:ro
    depends_on:
      mem0:
        condition: service_healthy
      orchestration:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  mem0:
    build:
      context: .
      dockerfile: docker/Dockerfile.memory
    ports:
      - "${MEM0_PORT:-3201}:3201"
    environment:
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ANONYMIZED_TELEMETRY: "False"
      CHROMA_PRODUCT_TELEMETRY_IMPL: chroma_noop_telemetry.NoopTelemetry
      CHROMA_TELEMETRY_IMPL: chroma_noop_telemetry.NoopTelemetry
      ORT_LOG_SEVERITY_LEVEL: "3"
    volumes:
      - mem0-logs:/app/services/memory/logs
      - mem0-history:/root/.mem0
      - ./services/memory/mem0-config.demo.yaml:/app/services/memory/mem0-config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:3201/health', timeout=3)\nPY"]
      interval: 30s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      MEMROOS_DOCKER_NEO4J_PASSWORD: ${MEMROOS_DOCKER_NEO4J_PASSWORD:-local-neo4j-password}
      NEO4J_AUTH: neo4j/${MEMROOS_DOCKER_NEO4J_PASSWORD:-local-neo4j-password}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p \"$${MEMROOS_DOCKER_NEO4J_PASSWORD}\" 'RETURN 1' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45s

  orchestration:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestration
    ports:
      - "${ORCHESTRATION_PORT:-3210}:3210"
    environment:
      ORCHESTRATION_DB_PATH: /data/orchestration.db
      ORCHESTRATION_RETRY_LIMIT: ${ORCHESTRATION_RETRY_LIMIT:-2}
    volumes:
      - orchestration-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:3210/health', timeout=3)\nPY"]
      interval: 30s
      timeout: 5s
      retries: 5

  connmem:
    build:
      context: .
      dockerfile: docker/Dockerfile.connmem
    ports:
      - "${CONNMEM_PORT:-3290}:3290"
    environment:
      CONNMEM_LEDGER_PATH: /data/connmem-ledger.db
    volumes:
      - connmem-data:/data
    healthcheck:
      # Single line, no heredoc: this is YAML *flow* style (inside [...]), where a
      # double-quoted scalar spanning lines folds its newlines into spaces. The
      # heredoc that used to live here therefore reached /bin/sh as one line, so
      # the shell parsed the "(" itself and the check failed with
      # 'Syntax error: "(" unexpected' every 30s — connmem reported unhealthy
      # for days while /health was returning 200 the whole time.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3290/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5

  knowledge-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.knowledge-mcp
    ports:
      - "${KNOWLEDGE_MCP_PORT:-3291}:3291"
    environment:
      KNOWLEDGE_BASE_PATH: /knowledge
    volumes:
      - ${KNOWLEDGE_BASE_PATH:-./docs}:/knowledge:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3291/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  memroos-data:
  mem0-logs:
  mem0-history:
  neo4j-data:
  neo4j-logs:
  orchestration-data:
  connmem-data:
